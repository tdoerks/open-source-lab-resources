name: Auto check-in status

on:
  schedule:
    - cron: '30 14 * * 1-5'  # 9:30am CDT (UTC-5) weekdays
    - cron: '30 22 * * 1-5'  # 5:30pm CDT (UTC-5) weekdays
  workflow_dispatch:           # allow manual trigger for testing

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update status
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "14" ]; then
            STATUS="remote"
            LABEL="Working Remotely"
          else
            STATUS="leave"
            LABEL="Out / On Leave"
          fi

          python3 - <<EOF
          import json, datetime

          with open('checkin-board/status.json') as f:
              state = json.load(f)

          now = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%S.000Z')
          status = "$STATUS"
          history = [{'status': status, 'note': '', 'at': now}] + state.get('history', [])
          state = {
              'status': status,
              'note': '',
              'updated_at': now,
              'history': history[:5]
          }

          with open('checkin-board/status.json', 'w') as f:
              json.dump(state, f, indent=2)

          print(f"Set status to: $LABEL")
          EOF

      - name: Commit and push
        run: |
          git config user.name "Check-in Bot"
          git config user.email "actions@github.com"
          git add checkin-board/status.json
          git diff --staged --quiet || git commit -m "Auto status update [skip ci]"
          git push
